name: Phrase Generator (AI 생성 + 독립 검수)

on:
  schedule:
    # 매일 20:00 UTC = 한국시간 05:00 (매일 소량 유지)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "bulk = 처음 한 번 대량 생성(약 2,600문장 후보), daily = 소량"
        type: choice
        options: [daily, bulk]
        default: daily

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run phrase generator
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PHRASE_GEN_MODE: ${{ inputs.mode || 'daily' }}
        run: python phrase_generator.py
